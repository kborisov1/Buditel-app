[project]
name = "buditel-backend"
version = "0.1.0"
description = "Backend for Buditel, the Bulgarian National Revival learning app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.1,<5.3",
    "django-ninja>=1.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs>=5.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DTZ", "TID"]

# Time is read only through apps.core.clock (architecture 7).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"django.utils.timezone.now".msg = "Use apps.core.clock.now(user) instead."

[tool.ruff.lint.per-file-ignores]
"apps/core/clock.py" = ["DTZ", "TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"
